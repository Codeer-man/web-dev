<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>websocket live test</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #fff;
      }
      #log {
        background: #000;
        padding: 10px;
        height: 400px;
        overflow-y: scroll;
        border: 1px solid #333;
        font-size: x-large;
      }
      .status-on {
        color: #00ff00;
      }
      .status-off {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <h1>websocket broadcast console</h1>
    <p class="status-off" id="status">connecting...</p>

    <form id="message-form">
      <input
        type="text"
        id="message-input"
        placeholder="send cargo..."
        required
      />
      <button type="submit">Deploy message</button>
    </form>

    <h3>Live stream</h3>
    <pre id="log"></pre>
  </body>

  <script>
    const statusEl = document.getElementById("status");
    const log = document.getElementById("log");
    const input = document.getElementById("message-input");

    const port = "ws://localhost:8080";

    // 1. initiate handshake
    const socket = new WebSocket(port);

    const appendLog = (label, message) => {
      const entry = `${new Date().toLocaleDateString()} ${label} ${message}\n`;
      log.textContent = entry + log.textContent;
    };

    /*
      addEventListener: alows multiple listener
      on: alows single listener
    */
    socket.addEventListener("open", () => {
      statusEl.textContent = `CONNECTED: ${port}`;
      statusEl.className = "status-on";
      appendLog("[SYSTEM] ", "Tunnel established");
    });

    // close the websocket and can be never reopened and need to create new websocket
    socket.addEventListener("close", () => {
      statusEl.textContent = "DISCONNECTED";
      statusEl.className = "status-off";
      appendLog("[SYSTEM] ", "Tunnel collapsed");
    });

    socket.addEventListener("message", (e) => {
      appendLog("[RECEIVED]", e.data);
    });

    document.getElementById("message-form").addEventListener("submit", (e) => {
      e.preventDefault();

      if (socket.readyState !== WebSocket.OPEN) {
        appendLog("[ERROR]: No activate tunnel found");
      }

      const msg = input.value.trim();
      socket.send(msg);
      appendLog("[SEND]", msg);

      input.value = "";
    });
  </script>
</html>
