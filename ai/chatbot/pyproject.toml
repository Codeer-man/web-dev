[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manish Manandhar", email = "mdrmoney34@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "dotenv>=0.9.9",
    "langchain>=1.4.8",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pypdf>=6.21.4",
    "requests>=2.34.2",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
